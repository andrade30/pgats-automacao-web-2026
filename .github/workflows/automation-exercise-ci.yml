name: WEB E2E TESTS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cypress-chrome:
    name: Cypress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rodar testes
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
        env:
          CYPRESS_LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          CYPRESS_LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          CYPRESS_LOGIN_NAME: ${{ secrets.LOGIN_NAME }}

      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cypress
          path: cypress/reports
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar screenshots das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  cypress-browserstack:
    name: Cypress (BrowserStack)
    runs-on: ubuntu-latest
    needs: cypress-chrome
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Rodar no BrowserStack
        run: >
          npm run test:browserstack --
          --env LOGIN_EMAIL=$LOGIN_EMAIL,LOGIN_PASSWORD=$LOGIN_PASSWORD,LOGIN_NAME="$LOGIN_NAME"
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_BUILD_NAME: gha-${{ github.run_number }}
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          LOGIN_NAME: ${{ secrets.LOGIN_NAME }}